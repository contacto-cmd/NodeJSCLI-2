<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Arquitectónico Cuántico - Throne Protocol</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #000000 0%, #1a0033 100%);
            color: #d4af37;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .subtitle {
            text-align: center;
            color: #fff;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        .panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .btn {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            color: #ffd700;
            font-weight: bold;
        }
        .stat-label {
            color: #fff;
            margin-top: 5px;
        }
        .log {
            background: #000;
            border: 1px solid #d4af37;
            border-radius: 5px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #d4af37;
            padding-left: 10px;
        }
        .log-success { border-left-color: #00ff00; color: #00ff00; }
        .log-error { border-left-color: #ff0000; color: #ff0000; }
        .log-info { border-left-color: #00bfff; color: #00bfff; }
        .designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .design-card {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
        }
        .design-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }
        .design-title {
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .design-detail {
            color: #fff;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        .loading {
            display: none;
            text-align: center;
            color: #ffd700;
            font-size: 1.2rem;
            margin: 20px 0;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ PANEL ARQUITECTÓNICO CUÁNTICO</h1>
        <p class="subtitle">Sistema de Generación con Física Real | Roberto Rivera Gamas</p>

        <div class="panel">
            <h2>⚡ GENERACIÓN MASIVA</h2>
            <button class="btn" onclick="generarPortafolio()">🚀 GENERAR 30 DISEÑOS ÚNICOS</button>
            <button class="btn" onclick="cargarEstadisticas()">📊 VER ESTADÍSTICAS</button>
            <button class="btn" onclick="listarDisenos()">📋 LISTAR TODOS LOS DISEÑOS</button>
            
            <div class="loading" id="loading">
                <p>⚙️ Generando diseños con física real...</p>
                <p>Esto puede tomar 1-2 minutos</p>
            </div>
        </div>

        <div class="panel" id="stats-panel" style="display:none;">
            <h2>📊 ESTADÍSTICAS DEL PORTAFOLIO</h2>
            <div class="stats" id="stats-grid"></div>
        </div>

        <div class="panel">
            <h2>📜 REGISTRO DE ACTIVIDAD</h2>
            <div class="log" id="log"></div>
        </div>

        <div class="panel" id="designs-panel" style="display:none;">
            <h2>🏗️ DISEÑOS GENERADOS</h2>
            <div class="designs-grid" id="designs-grid"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }

        async function generarPortafolio() {
            const btn = event.target;
            btn.disabled = true;
            document.getElementById('loading').classList.add('active');
            
            log('🚀 Iniciando generación masiva de 30 diseños únicos...', 'info');
            
            try {
                const response = await fetch('/api/arquitectura/masivo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ limite: 30 })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log(`✅ Generación completada: ${data.generados} diseños creados`, 'success');
                    log(`💰 Total portafolio: ${data.total_portafolio} proyectos`, 'success');
                    if (data.errores > 0) {
                        log(`⚠️ Hubo ${data.errores} errores durante la generación`, 'error');
                    }
                    cargarEstadisticas();
                } else {
                    log(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error de red: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.remove('active');
            }
        }

        async function cargarEstadisticas() {
            log('📊 Cargando estadísticas...', 'info');
            
            try {
                const response = await fetch('/api/arquitectura/stats');
                const data = await response.json();
                
                if (data.success) {
                    const statsPanel = document.getElementById('stats-panel');
                    const statsGrid = document.getElementById('stats-grid');
                    
                    statsGrid.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-value">${data.total_disenos}</div>
                            <div class="stat-label">Diseños Totales</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">$${data.valor_total_portafolio_usd}</div>
                            <div class="stat-label">Valor Total Portafolio</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">$${data.valor_promedio_usd}</div>
                            <div class="stat-label">Valor Promedio por Diseño</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.diseño_mas_alto.altura_m}m</div>
                            <div class="stat-label">Diseño Más Alto</div>
                        </div>
                    `;
                    
                    statsPanel.style.display = 'block';
                    log('✅ Estadísticas cargadas', 'success');
                } else {
                    log(`❌ Error: ${data.error || data.mensaje}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function listarDisenos() {
            log('📋 Listando diseños...', 'info');
            
            try {
                const response = await fetch('/api/arquitectura/proyectos');
                const data = await response.json();
                
                if (data.success) {
                    const designsPanel = document.getElementById('designs-panel');
                    const designsGrid = document.getElementById('designs-grid');
                    
                    designsGrid.innerHTML = data.disenos.map(d => `
                        <div class="design-card">
                            <div class="design-title">${d.diseño.nombre}</div>
                            <div class="design-detail">📏 ${d.especificaciones.dimensiones.altura_total_m}m × ${d.especificaciones.dimensiones.ancho_m}m</div>
                            <div class="design-detail">🏗️ ${d.especificaciones.numero_pisos} pisos</div>
                            <div class="design-detail">⚖️ ${d.analisis_estructural.peso_estructura.peso_toneladas} toneladas</div>
                            <div class="design-detail">💰 $${d.valoracion.valor_mercado_usd}</div>
                            <div class="design-detail">📍 ${d.ubicacion.terreno_tipo}</div>
                            <div class="design-detail" style="font-size:0.8rem; margin-top:5px; color:#888;">ID: ${d.id_proyecto}</div>
                        </div>
                    `).join('');
                    
                    designsPanel.style.display = 'block';
                    log(`✅ ${data.total} diseños listados`, 'success');
                } else {
                    log(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Log inicial
        log('🏆 Panel Arquitectónico Cuántico iniciado', 'success');
        log('💎 Sistema con física real: gravedad, materiales, voladizos', 'info');
    </script>
</body>
</html>
