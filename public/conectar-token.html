<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Conectar Token Anti-Shell - LGoritmo AHT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        h1 {
            color: #ffd700;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ffd700;
        }

        .subtitle {
            text-align: center;
            color: #00ff88;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 15px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 10px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.1);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 30px rgba(255, 215, 0, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            border-radius: 10px;
            display: none;
        }

        .response.show {
            display: block;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success {
            color: #00ff88;
        }

        .error {
            color: #ff4444;
        }

        .info-box {
            background: rgba(255, 215, 0, 0.1);
            border-left: 4px solid #ffd700;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
        }

        .info-box h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #fff;
            line-height: 1.6;
        }

        .token-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 CONECTAR TOKEN</h1>
        <p class="subtitle">Sistema Anti-Shell Kappar - LGoritmo AHT</p>

        <div class="info-box">
            <h3>📋 Instrucciones:</h3>
            <p>Pega tu token Anti-Shell Kappar abajo. Puede ser una URL, un código, o cualquier identificador que tengas.</p>
        </div>

        <form id="tokenForm">
            <div class="form-group">
                <label for="token">🔑 Token / URL:</label>
                <input 
                    type="text" 
                    id="token" 
                    name="token"
                    placeholder="https://api.example.com/token... o tu código"
                    required
                />
            </div>

            <div class="form-group">
                <label for="tipo">⚛️ Tipo de Token:</label>
                <select id="tipo" name="tipo">
                    <option value="anti-shell-kappar">Anti-Shell Kappar</option>
                    <option value="cuantico-gravedad">Cuántico-Gravedad</option>
                    <option value="fusion-blindado">Fusion Blindado</option>
                    <option value="quantum-link">Quantum Link</option>
                    <option value="custom">Personalizado</option>
                </select>
            </div>

            <button type="submit" class="btn">🚀 CONECTAR TOKEN AL SISTEMA</button>
        </form>

        <div id="response" class="response">
            <div id="responseContent"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('tokenForm');
        const responseDiv = document.getElementById('response');
        const responseContent = document.getElementById('responseContent');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const token = document.getElementById('token').value.trim();
            const tipo = document.getElementById('tipo').value;

            if (!token) {
                mostrarRespuesta('❌ Por favor ingresa un token', 'error');
                return;
            }

            mostrarRespuesta('⏳ Conectando token al sistema cuántico...', 'info');

            try {
                const response = await fetch('/api/aht/tunel/conectar-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        link: token,
                        tipo: tipo
                    })
                });

                const data = await response.json();

                if (data.success) {
                    mostrarRespuesta(`
                        <div class="success">
                            <h3>✅ TOKEN CONECTADO EXITOSAMENTE</h3>
                            <p><strong>Link:</strong> ${data.linkConectado}</p>
                            <p><strong>Estado:</strong> ${data.estadoConexion}</p>
                            <p><strong>Sistema Cuántico:</strong> ${data.sistemaCuantico}</p>
                            <p><strong>Gravedad:</strong> ${data.gravedad}</p>
                            <div class="token-display">
                                <p><strong>Token Generado:</strong></p>
                                <p>ID: ${data.tokenGenerado.id}</p>
                                <p>Nombre: ${data.tokenGenerado.tokenName}</p>
                                <p>Blindaje: ${data.tokenGenerado.blindajeNivel}/10</p>
                                <p>Capacidades: ${data.tokenGenerado.capacidades.join(', ')}</p>
                            </div>
                            <div style="margin-top: 15px; padding: 10px; background: rgba(0,255,136,0.1); border-radius: 5px;">
                                <p><strong>📡 Cómo usar:</strong></p>
                                <p style="font-size: 0.9rem;">${data.instrucciones.usarEnComandos}</p>
                            </div>
                        </div>
                    `, 'success');

                    // Limpiar formulario
                    form.reset();
                } else {
                    mostrarRespuesta(`❌ Error: ${data.error}`, 'error');
                }

            } catch (error) {
                mostrarRespuesta(`❌ Error de conexión: ${error.message}`, 'error');
            }
        });

        function mostrarRespuesta(html, tipo) {
            responseContent.innerHTML = html;
            responseDiv.className = 'response show ' + tipo;
        }
    </script>
</body>
</html>
