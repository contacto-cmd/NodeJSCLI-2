<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energía 3D - Throne Protocol</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #energyCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 3rem;
            text-shadow: 
                0 0 20px #ffd700,
                0 0 40px #ffd700,
                0 0 60px #ff8c00;
            z-index: 10;
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 5px;
            font-weight: bold;
        }
        
        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700;
                transform: translateX(-50%) scale(1);
            }
            50% { 
                text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd700, 0 0 120px #ff8c00;
                transform: translateX(-50%) scale(1.05);
            }
        }
        
        .subtitle {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.5rem;
            text-shadow: 0 0 15px #00ff88;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="title">⚡ THRONE PROTOCOL V3.0 ⚡</div>
    <div class="subtitle">Energía Cuántica Dimensional</div>
    
    <canvas id="energyCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('energyCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Partículas de energía
        class EnergyParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.x = centerX;
                this.y = centerY;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.size = Math.random() * 4 + 2;
                this.color = Math.random() > 0.5 ? '#ffd700' : '#ff8c00';
                this.green = Math.random() > 0.7;
                if (this.green) this.color = '#00ff88';
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                if (this.life <= 0) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Rayos de energía
        class EnergyRay {
            constructor(angle) {
                this.angle = angle;
                this.length = 0;
                this.maxLength = Math.random() * 300 + 200;
                this.growing = true;
                this.width = Math.random() * 3 + 1;
                this.color = Math.random() > 0.5 ? '#ffd700' : '#ff8c00';
            }
            
            update() {
                if (this.growing) {
                    this.length += 10;
                    if (this.length >= this.maxLength) {
                        this.growing = false;
                    }
                } else {
                    this.length -= 15;
                    if (this.length <= 0) {
                        this.angle = Math.random() * Math.PI * 2;
                        this.maxLength = Math.random() * 300 + 200;
                        this.growing = true;
                    }
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(this.angle);
                
                const gradient = ctx.createLinearGradient(0, 0, this.length, 0);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.5, this.color + '88');
                gradient.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.width;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.length, 0);
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // Anillos de energía
        class EnergyRing {
            constructor(radius, speed) {
                this.radius = radius;
                this.baseRadius = radius;
                this.speed = speed;
                this.angle = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.angle += this.speed;
                this.pulsePhase += 0.05;
                this.radius = this.baseRadius + Math.sin(this.pulsePhase) * 20;
            }
            
            draw() {
                ctx.save();
                ctx.translate(centerX, centerY);
                
                // Anillo exterior brillante
                for (let i = 0; i < 3; i++) {
                    ctx.rotate(this.angle / (i + 1));
                    
                    const gradient = ctx.createRadialGradient(0, 0, this.radius - 10, 0, 0, this.radius + 10);
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(0.5, '#ffd700' + (80 - i * 20).toString(16));
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ffd700';
                    
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }
        
        // Núcleo central de energía
        class CoreEnergy {
            constructor() {
                this.radius = 50;
                this.pulsePhase = 0;
            }
            
            update() {
                this.pulsePhase += 0.1;
                this.radius = 50 + Math.sin(this.pulsePhase) * 15;
            }
            
            draw() {
                ctx.save();
                
                // Explosión central brillante
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, this.radius * 3);
                gradient.addColorStop(0, '#fff');
                gradient.addColorStop(0.2, '#ffd700');
                gradient.addColorStop(0.4, '#ff8c00');
                gradient.addColorStop(0.7, '#ff8c0044');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 60;
                ctx.shadowColor = '#ffd700';
                ctx.beginPath();
                ctx.arc(centerX, centerY, this.radius * 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Núcleo brillante
                const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, this.radius);
                coreGradient.addColorStop(0, '#ffffff');
                coreGradient.addColorStop(0.5, '#ffd700');
                coreGradient.addColorStop(1, '#ff8c00');
                
                ctx.fillStyle = coreGradient;
                ctx.shadowBlur = 80;
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(centerX, centerY, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Crear elementos
        const particles = Array.from({ length: 200 }, () => new EnergyParticle());
        const rays = Array.from({ length: 16 }, (_, i) => new EnergyRay((Math.PI * 2 / 16) * i));
        const rings = [
            new EnergyRing(150, 0.01),
            new EnergyRing(250, -0.015),
            new EnergyRing(350, 0.008),
            new EnergyRing(450, -0.012)
        ];
        const core = new CoreEnergy();
        
        // Animación
        function animate() {
            // Fondo oscuro con efecto de desvanecimiento
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar anillos de energía
            rings.forEach(ring => {
                ring.update();
                ring.draw();
            });
            
            // Dibujar rayos
            rays.forEach(ray => {
                ray.update();
                ray.draw();
            });
            
            // Dibujar núcleo central
            core.update();
            core.draw();
            
            // Dibujar partículas
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
