<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throne Protocol - Entrada Principal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        /* Imagen de fondo completa con movimiento sutil */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('throne-background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            animation: bgGlow 4s ease-in-out infinite, bgShift 20s ease-in-out infinite;
        }
        
        @keyframes bgGlow {
            0%, 100% { filter: brightness(1) contrast(1.1); }
            50% { filter: brightness(1.2) contrast(1.2); }
        }
        
        @keyframes bgShift {
            0%, 100% { 
                transform: scale(1.02);
                background-position: center center;
            }
            25% { 
                transform: scale(1.05);
                background-position: 51% 51%;
            }
            50% { 
                transform: scale(1.03);
                background-position: center center;
            }
            75% { 
                transform: scale(1.05);
                background-position: 49% 49%;
            }
        }
        
        /* Canvas para partículas flotantes encima */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }
        
        /* Título sobre la imagen */
        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 3.5rem;
            text-shadow: 
                0 0 30px #000,
                0 0 40px #ffd700,
                0 0 60px #ffd700,
                0 0 80px #ff8c00;
            z-index: 10;
            animation: titleGlow 2s ease-in-out infinite;
            letter-spacing: 8px;
            font-weight: bold;
        }
        
        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 0 0 30px #000, 0 0 40px #ffd700, 0 0 60px #ffd700;
                transform: translateX(-50%) scale(1);
            }
            50% { 
                text-shadow: 0 0 30px #000, 0 0 60px #ffd700, 0 0 90px #ffd700, 0 0 120px #ff8c00;
                transform: translateX(-50%) scale(1.05);
            }
        }
        
        .subtitle {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff88;
            font-size: 1.8rem;
            text-shadow: 
                0 0 20px #000,
                0 0 30px #00ff88;
            z-index: 10;
            letter-spacing: 3px;
        }
        
        /* Botón de entrada */
        .enter-button {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 60px;
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            border: 3px solid #ffd700;
            border-radius: 15px;
            color: #000;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.8),
                0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            letter-spacing: 3px;
        }
        
        .enter-button:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 
                0 0 60px rgba(255, 215, 0, 1),
                0 15px 40px rgba(0, 0, 0, 0.7);
            background: linear-gradient(145deg, #ff8c00, #ffd700);
        }
    </style>
</head>
<body>
    <div class="title">♟️ THRONE PROTOCOL V3.0 ♟️</div>
    <div class="subtitle">Portal Dimensional - Street Emporio Royal</div>
    
    <!-- Imagen de fondo completa -->
    <div class="background-image"></div>
    
    <!-- Canvas de partículas flotantes -->
    <canvas id="particlesCanvas"></canvas>
    
    <!-- Botón de entrada -->
    <button class="enter-button" onclick="location.href='/menu.html'">
        ENTRAR AL SISTEMA
    </button>
    
    <script>
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Partículas de energía flotantes con colores arcoíris camaleón
        class Particle {
            constructor() {
                this.hue = Math.random() * 360; // Color inicial en el espectro
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                // Más movimiento dinámico (drones flotantes)
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 4 + 2);
                this.size = Math.random() * 6 + 3;
                this.life = 1;
                this.decay = Math.random() * 0.008 + 0.003;
                this.hueSpeed = Math.random() * 4 + 1.5;
                // Rotación para efecto de drones girando
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 5;
            }
            
            update() {
                // Movimiento ondulatorio (efecto drones flotantes)
                this.x += this.vx + Math.sin(Date.now() / 1000 + this.x) * 0.5;
                this.y += this.vy;
                this.life -= this.decay;
                
                // Cambiar color tipo camaleón (morado/gris diamante)
                this.hue = (this.hue + this.hueSpeed) % 360;
                
                // Rotación de drones
                this.rotation += this.rotationSpeed;
                
                if (this.life <= 0 || this.y < -20) {
                    this.reset();
                    this.hue = Math.random() * 360;
                }
            }
            
            getColor() {
                // Alternar entre gris diamante y morado diamante (sin rosa)
                if (this.hue < 180) {
                    // Gris diamante brillante (plateado cristalino)
                    const brightness = 65 + Math.sin(this.hue / 20) * 15;
                    return `hsl(240, 10%, ${brightness}%)`; // Tono azulado gris
                } else {
                    // Morado diamante brillante profundo (270-290 = morado puro, evitar rosa)
                    const purpleHue = 275 + Math.sin(this.hue / 15) * 10;
                    return `hsl(${purpleHue}, 90%, 60%)`; // Morado intenso sin rosa
                }
            }
            
            draw() {
                const color = this.getColor();
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180); // Rotar el cuadrito (drone)
                
                // Sombra 3D (profundidad)
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;
                
                // Marco exterior brillante (efecto diamante 3D)
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 40;
                ctx.shadowColor = color;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Marco interior (doble borde para efecto 3D)
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = this.life * 0.7;
                ctx.strokeRect(-this.size/2 + 1, -this.size/2 + 1, this.size - 2, this.size - 2);
                
                // Resplandor exterior
                ctx.globalAlpha = this.life * 0.4;
                ctx.lineWidth = 5;
                ctx.shadowBlur = 40;
                ctx.strokeRect(-this.size/2 - 1, -this.size/2 - 1, this.size + 2, this.size + 2);
                
                // Esquinas brillantes (efecto diamante cristalino)
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                const cornerSize = 3;
                // Esquina superior izquierda
                ctx.fillRect(-this.size/2, -this.size/2, cornerSize, cornerSize);
                // Esquina superior derecha
                ctx.fillRect(this.size/2 - cornerSize, -this.size/2, cornerSize, cornerSize);
                // Esquina inferior izquierda
                ctx.fillRect(-this.size/2, this.size/2 - cornerSize, cornerSize, cornerSize);
                // Esquina inferior derecha
                ctx.fillRect(this.size/2 - cornerSize, this.size/2 - cornerSize, cornerSize, cornerSize);
                
                ctx.restore();
            }
        }
        
        // Crear partículas arcoíris
        const particles = Array.from({ length: 200 }, () => new Particle());
        
        // Animación
        function animate() {
            // Fondo transparente para que se vea la imagen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Actualizar y dibujar partículas
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
