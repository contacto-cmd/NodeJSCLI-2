<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throne Protocol V3.0 - Entrada Cinematográfica</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .background-cinematic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('throne-entrance-cinematic.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            animation: subtleBreathing 8s ease-in-out infinite;
        }
        
        @keyframes subtleBreathing {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1) contrast(1.05);
            }
            50% { 
                transform: scale(1.02);
                filter: brightness(1.15) contrast(1.1);
            }
        }
        
        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 
                0 0 30px rgba(255, 215, 0, 1),
                0 0 60px rgba(255, 215, 0, 0.7),
                0 0 90px rgba(255, 215, 0, 0.5);
            z-index: 100;
            text-align: center;
            animation: titleGlow 3s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 
                    0 0 30px rgba(255, 215, 0, 1),
                    0 0 60px rgba(255, 215, 0, 0.7);
            }
            50% {
                text-shadow: 
                    0 0 50px rgba(255, 215, 0, 1),
                    0 0 100px rgba(255, 215, 0, 0.9),
                    0 0 150px rgba(255, 215, 0, 0.6);
            }
        }
        
        .subtitle {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #00FFFF;
            text-shadow: 
                0 0 20px rgba(0, 255, 255, 0.8),
                0 0 40px rgba(0, 255, 255, 0.5);
            z-index: 100;
            text-align: center;
        }
        
        .enter-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(138, 43, 226, 0.2),
                rgba(138, 43, 226, 0));
            border: 4px solid rgba(138, 43, 226, 0.5);
            cursor: pointer;
            z-index: 50;
            animation: explosionPulse 2s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        
        .enter-button:hover {
            background: radial-gradient(circle, 
                rgba(138, 43, 226, 0.4),
                rgba(138, 43, 226, 0.1));
            border-color: rgba(138, 43, 226, 0.9);
            box-shadow: 
                0 0 50px rgba(138, 43, 226, 0.8),
                0 0 100px rgba(138, 43, 226, 0.5);
        }
        
        @keyframes explosionPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 40px rgba(138, 43, 226, 0.6);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.15);
                box-shadow: 
                    0 0 80px rgba(138, 43, 226, 0.9),
                    0 0 120px rgba(255, 215, 0, 0.5);
            }
        }
        
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="background-cinematic"></div>
    
    <canvas id="particles-canvas"></canvas>
    
    <div class="title">♟️ THRONE PROTOCOL V3.0 ♟️</div>
    <div class="subtitle">$229.8 Billion Command Center - Street Emporio Royal</div>
    
    <div class="enter-button" onclick="location.href='/menu.html'"></div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = Math.random() > 0.5 ? 
                    `rgba(157, 78, 221, ${Math.random() * 0.5 + 0.3})` : 
                    `rgba(192, 192, 192, ${Math.random() * 0.4 + 0.2})`;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
