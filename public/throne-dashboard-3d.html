<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 THRONE PROTOCOL V3.0 - DASHBOARD PRESIDENCIAL 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #d4af37;
        }
        
        /* TABLERO 3D ÉPICO - IMAGEN DE FONDO */
        .tablero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('tablero-principal.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            animation: tableroGlow 4s ease-in-out infinite, tableroZoom 30s ease-in-out infinite;
        }
        
        @keyframes tableroGlow {
            0%, 100% { filter: brightness(1) contrast(1.1) saturate(1.2); }
            50% { filter: brightness(1.3) contrast(1.3) saturate(1.4); }
        }
        
        @keyframes tableroZoom {
            0%, 100% { 
                transform: scale(1);
                background-position: center center;
            }
            25% { 
                transform: scale(1.05);
                background-position: 52% 48%;
            }
            50% { 
                transform: scale(1.08);
                background-position: center bottom;
            }
            75% { 
                transform: scale(1.05);
                background-position: 48% 52%;
            }
        }
        
        /* OVERLAY DORADO ÉPICO */
        .golden-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, 
                rgba(255, 215, 0, 0.15) 0%, 
                rgba(255, 140, 0, 0.08) 30%, 
                transparent 70%);
            z-index: 2;
            pointer-events: none;
            animation: overlayPulse 6s ease-in-out infinite;
        }
        
        @keyframes overlayPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        /* PARTÍCULAS DE ENERGÍA DORADA */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
        }
        
        /* HEADER PRESIDENCIAL */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 10;
        }
        
        .title {
            text-align: center;
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 
                0 0 30px #ffd700,
                0 0 60px #ffd700,
                0 0 90px #ff8c00,
                0 0 120px #ff8c00,
                2px 2px 4px #000;
            animation: titleMega 3s ease-in-out infinite;
            letter-spacing: 10px;
            font-weight: bold;
        }
        
        @keyframes titleMega {
            0%, 100% {
                transform: scale(1);
                text-shadow: 
                    0 0 30px #ffd700,
                    0 0 60px #ffd700,
                    0 0 90px #ff8c00,
                    2px 2px 4px #000;
            }
            50% {
                transform: scale(1.05);
                text-shadow: 
                    0 0 50px #ffd700,
                    0 0 100px #ffd700,
                    0 0 150px #ff8c00,
                    0 0 200px #ff8c00,
                    3px 3px 6px #000;
            }
        }
        
        .subtitle {
            text-align: center;
            font-size: 1.8rem;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 1px 1px 2px #000;
            margin-top: 10px;
            animation: subtitleGlow 2s ease-in-out infinite;
        }
        
        @keyframes subtitleGlow {
            0%, 100% { text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 1px 1px 2px #000; }
            50% { text-shadow: 0 0 35px #00ff88, 0 0 70px #00ff88, 0 0 105px #00ff88, 2px 2px 3px #000; }
        }
        
        .empresa {
            text-align: center;
            font-size: 2.2rem;
            color: #d4af37;
            margin-top: 15px;
            text-shadow: 0 0 15px #d4af37, 2px 2px 3px #000;
            font-weight: bold;
        }
        
        /* ESTADÍSTICAS FLOTANTES */
        .stats-container {
            position: fixed;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .stat-card {
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.95), rgba(26, 0, 51, 0.9));
            border: 3px solid #d4af37;
            border-radius: 20px;
            padding: 25px 35px;
            min-width: 200px;
            text-align: center;
            box-shadow: 
                0 0 40px rgba(255, 215, 0, 0.6),
                inset 0 0 20px rgba(255, 215, 0, 0.2);
            animation: statFloat 3s ease-in-out infinite;
            backdrop-filter: blur(10px);
        }
        
        .stat-card:nth-child(1) { animation-delay: 0s; }
        .stat-card:nth-child(2) { animation-delay: 0.5s; }
        .stat-card:nth-child(3) { animation-delay: 1s; }
        .stat-card:nth-child(4) { animation-delay: 1.5s; }
        
        @keyframes statFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        .stat-value {
            font-size: 3rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00;
        }
        
        .stat-label {
            font-size: 1rem;
            color: #ffffff;
            margin-top: 8px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        
        /* MENÚ DE ACCIONES */
        .actions-menu {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .action-button {
            background: linear-gradient(145deg, #d4af37, #ffd700);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 20px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.8),
                0 10px 25px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }
        
        .action-button:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 1),
                0 15px 40px rgba(0, 0, 0, 0.8);
            background: linear-gradient(145deg, #ffd700, #ff8c00);
        }
        
        /* LOGO PRESIDENCIAL */
        .presidential-seal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            opacity: 0.15;
            z-index: 4;
            animation: sealRotate 60s linear infinite;
            filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.8));
        }
        
        @keyframes sealRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- TABLERO 3D ÉPICO BACKGROUND -->
    <div class="tablero-background"></div>
    
    <!-- OVERLAY DORADO -->
    <div class="golden-overlay"></div>
    
    <!-- LOGO PRESIDENCIAL ROTATORIO -->
    <div class="presidential-seal">👑</div>
    
    <!-- PARTÍCULAS DE ENERGÍA -->
    <canvas id="particlesCanvas"></canvas>
    
    <!-- HEADER -->
    <div class="header">
        <div class="title">👑 THRONE PROTOCOL V3.0 👑</div>
        <div class="subtitle">DASHBOARD PRESIDENCIAL - NIVEL GUBERNAMENTAL</div>
        <div class="empresa">Street Emporio Royal</div>
    </div>
    
    <!-- ESTADÍSTICAS -->
    <div class="stats-container">
        <div class="stat-card">
            <div class="stat-value" id="totalDisenos">32</div>
            <div class="stat-label">Diseños Con Física Real</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-value">$229.8B</div>
            <div class="stat-label">Valoración Total</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-value">RSA-4096</div>
            <div class="stat-label">Firma Digital</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-value">7</div>
            <div class="stat-label">Materiales Físicos</div>
        </div>
    </div>
    
    <!-- MENÚ DE ACCIONES -->
    <div class="actions-menu">
        <a href="/arquitectura-panel.html" class="action-button">
            🏗️ ARQUITECTURA CUÁNTICA
        </a>
        <a href="/galeria-arquitectura.html" class="action-button">
            🌍 GALERÍA 3D
        </a>
        <a href="/certificados-premium.html" class="action-button">
            📜 CERTIFICADOS
        </a>
        <a href="/documentacion-profesional.html" class="action-button">
            📊 DOCS INVERSIONISTAS
        </a>
        <a href="/vault.html" class="action-button">
            🔐 VAULT
        </a>
    </div>
    
    <script>
        // ============================================
        // SISTEMA DE PARTÍCULAS DE ENERGÍA DORADA
        // ============================================
        
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        class GoldenParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -(Math.random() * 3 + 1.5);
                this.size = Math.random() * 8 + 4;
                this.life = 1;
                this.decay = Math.random() * 0.006 + 0.003;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 3;
                this.hue = Math.random() * 60 + 30; // Dorado a naranja
            }
            
            update() {
                this.x += this.vx + Math.sin(Date.now() / 800 + this.x) * 0.5;
                this.y += this.vy;
                this.life -= this.decay;
                this.rotation += this.rotationSpeed;
                
                if (this.life <= 0 || this.y < -50) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.life;
                
                // Resplandor exterior
                ctx.shadowBlur = 30;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                
                // Cuadrado dorado brillante
                ctx.strokeStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.lineWidth = 3;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Marco interior
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-this.size/2 + 1, -this.size/2 + 1, this.size - 2, this.size - 2);
                
                // Esquinas brillantes (diamante)
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 20;
                const corner = 2.5;
                ctx.fillRect(-this.size/2, -this.size/2, corner, corner);
                ctx.fillRect(this.size/2 - corner, -this.size/2, corner, corner);
                ctx.fillRect(-this.size/2, this.size/2 - corner, corner, corner);
                ctx.fillRect(this.size/2 - corner, this.size/2 - corner, corner, corner);
                
                ctx.restore();
            }
        }
        
        // Rayos de energía desde el centro
        class EnergyRay {
            constructor(angle) {
                this.angle = angle;
                this.length = 0;
                this.maxLength = Math.random() * 400 + 300;
                this.growing = true;
                this.width = Math.random() * 4 + 2;
            }
            
            update() {
                if (this.growing) {
                    this.length += 15;
                    if (this.length >= this.maxLength) {
                        this.growing = false;
                    }
                } else {
                    this.length -= 20;
                    if (this.length <= 0) {
                        this.angle = Math.random() * Math.PI * 2;
                        this.maxLength = Math.random() * 400 + 300;
                        this.growing = true;
                    }
                }
            }
            
            draw() {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(this.angle);
                
                const gradient = ctx.createLinearGradient(0, 0, this.length, 0);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 140, 0, 0.4)');
                gradient.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.width;
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#ffd700';
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.length, 0);
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // Crear partículas y rayos
        const particles = Array.from({ length: 150 }, () => new GoldenParticle());
        const rays = Array.from({ length: 12 }, (_, i) => new EnergyRay((Math.PI * 2 / 12) * i));
        
        // Animación
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar rayos de energía
            rays.forEach(ray => {
                ray.update();
                ray.draw();
            });
            
            // Dibujar partículas
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // ============================================
        // ACTUALIZAR ESTADÍSTICAS EN TIEMPO REAL
        // ============================================
        
        async function actualizarStats() {
            try {
                const response = await fetch('/api/arquitectura/stats');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalDisenos').textContent = data.total_disenos || 32;
                }
            } catch (error) {
                console.log('Usando valores por defecto');
            }
        }
        
        actualizarStats();
        setInterval(actualizarStats, 30000); // Cada 30 segundos
    </script>
    
    <!-- TOUR GUIADO PRESIDENCIAL -->
    <script src="/guided-tour.js"></script>
</body>
</html>
