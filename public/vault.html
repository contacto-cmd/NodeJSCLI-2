<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Cifrado - Throne Protocol V3.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #d4af37;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700;
            animation: headerGlow 3s ease-in-out infinite;
        }
        
        @keyframes headerGlow {
            0%, 100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700; }
            50% { text-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700, 0 0 90px #ff8c00; }
        }
        
        .subtitle {
            text-align: center;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.9), rgba(26, 0, 51, 0.7));
            border: 3px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        
        .card h2 {
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffd700;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-box {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            color: #ffd700;
            font-weight: bold;
        }
        
        .stat-label {
            color: #fff;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .category-btn {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            border: none;
            padding: 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .category-btn:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }
        
        .category-btn.active {
            background: linear-gradient(135deg, #00ff88, #00cc66);
        }
        
        .secret-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .secret-item {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            transition: all 0.3s;
        }
        
        .secret-item:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }
        
        .secret-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .secret-name {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
        }
        
        .secret-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.5);
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 0.9rem;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }
        
        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            border-radius: 8px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        
        .form-group {
            margin: 15px 0;
        }
        
        label {
            display: block;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .success {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            color: #00ff88;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            color: #ff6666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: linear-gradient(145deg, #0a0a0a, #1a0033);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .close-modal {
            float: right;
            font-size: 2rem;
            color: #ffd700;
            cursor: pointer;
        }
        
        @media (max-width: 968px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 VAULT CIFRADO</h1>
        <div class="subtitle">Sistema de Bóveda Personal - Cifrado AES-256-GCM + RSA-4096</div>
        
        <div class="grid">
            <div class="card">
                <h2>📊 Estadísticas</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-number" id="totalSecrets">0</div>
                        <div class="stat-label">Total Secretos</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalPasswords">0</div>
                        <div class="stat-label">Contraseñas</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalApiKeys">0</div>
                        <div class="stat-label">API Keys</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="totalCertificates">0</div>
                        <div class="stat-label">Certificados</div>
                    </div>
                </div>
                
                <h2 style="margin-top: 30px;">📁 Categorías</h2>
                <button class="category-btn active" onclick="selectCategory('passwords')">
                    🔑 Contraseñas
                </button>
                <button class="category-btn" onclick="selectCategory('apiKeys')">
                    🔐 API Keys
                </button>
                <button class="category-btn" onclick="selectCategory('certificates')">
                    📜 Certificados
                </button>
                <button class="category-btn" onclick="selectCategory('documents')">
                    📄 Documentos
                </button>
                
                <button class="btn" style="width: 100%; margin-top: 20px;" onclick="openAddModal()">
                    ➕ Agregar Nuevo Secreto
                </button>
            </div>
            
            <div class="card">
                <h2 id="categoryTitle">🔑 Contraseñas</h2>
                <div id="secretsList" class="secret-list">
                    <p style="color: #888; text-align: center; padding: 50px;">
                        Cargando secretos...
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAddModal()">&times;</span>
            <h2>➕ Agregar Nuevo Secreto</h2>
            
            <div class="form-group">
                <label>Categoría:</label>
                <select id="newCategory" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.7); border: 2px solid #d4af37; border-radius: 8px; color: #ffd700;">
                    <option value="passwords">🔑 Contraseña</option>
                    <option value="apiKeys">🔐 API Key</option>
                    <option value="certificates">📜 Certificado</option>
                    <option value="documents">📄 Documento</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="newName" placeholder="Ej: Gmail Personal">
            </div>
            
            <div class="form-group">
                <label>Valor (será cifrado):</label>
                <textarea id="newValue" placeholder="Ej: mi_contraseña_super_segura_123"></textarea>
            </div>
            
            <div id="addResult"></div>
            
            <button class="btn" onclick="addNewSecret()">💾 Guardar Secreto Cifrado</button>
        </div>
    </div>
    
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeViewModal()">&times;</span>
            <h2>🔍 Ver Secreto</h2>
            <div id="secretDetails"></div>
        </div>
    </div>
    
    <script>
        let currentCategory = 'passwords';
        let currentSecrets = {};
        let vaultSessionToken = localStorage.getItem('vaultSessionToken');
        
        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-Vault-Session': vaultSessionToken || ''
            };
        }
        
        async function checkAuthentication() {
            if (!vaultSessionToken) {
                showLoginModal();
                return false;
            }
            
            try {
                const response = await fetch('/api/vault/stats', {
                    headers: getAuthHeaders()
                });
                
                if (response.status === 401) {
                    localStorage.removeItem('vaultSessionToken');
                    vaultSessionToken = null;
                    showLoginModal();
                    return false;
                }
                
                return true;
            } catch (error) {
                showLoginModal();
                return false;
            }
        }
        
        function showLoginModal() {
            const loginHTML = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center;">
                    <div style="background: linear-gradient(145deg, #0a0a0a, #1a0033); border: 3px solid #ffd700; border-radius: 15px; padding: 40px; max-width: 500px; width: 90%;">
                        <h2 style="color: #ffd700; margin-bottom: 20px; text-align: center;">🔐 Autenticación de Vault</h2>
                        <p style="color: #fff; margin-bottom: 20px;">Ingresa la contraseña maestra para acceder al vault cifrado:</p>
                        <input type="password" id="vaultPassword" placeholder="Contraseña Maestra" style="width: 100%; padding: 15px; background: rgba(0,0,0,0.7); border: 2px solid #d4af37; border-radius: 8px; color: #ffd700; font-family: 'Courier New', monospace; font-size: 1.1rem; margin-bottom: 20px;">
                        <div id="loginError" style="margin-bottom: 15px;"></div>
                        <button onclick="authenticateVault()" style="background: linear-gradient(135deg, #d4af37, #ffd700); color: #000; border: none; padding: 15px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%;">
                            🔓 Desbloquear Vault
                        </button>
                        <p style="color: #888; margin-top: 20px; font-size: 0.9rem; text-align: center;">
                            Contraseña por defecto: <code style="color: #ffd700;">Royal2025</code>
                        </p>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', loginHTML);
            
            document.getElementById('vaultPassword').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    authenticateVault();
                }
            });
        }
        
        async function authenticateVault() {
            const password = document.getElementById('vaultPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!password) {
                errorDiv.innerHTML = '<div class="error">Ingresa la contraseña</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/vault/authenticate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    vaultSessionToken = data.sessionToken;
                    localStorage.setItem('vaultSessionToken', vaultSessionToken);
                    location.reload();
                } else {
                    errorDiv.innerHTML = `<div class="error">❌ ${data.error}</div>`;
                }
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function loadStats() {
            if (!await checkAuthentication()) return;
            
            try {
                const response = await fetch('/api/vault/stats', {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalSecrets').textContent = data.stats.totalSecrets;
                    document.getElementById('totalPasswords').textContent = data.stats.passwords;
                    document.getElementById('totalApiKeys').textContent = data.stats.apiKeys;
                    document.getElementById('totalCertificates').textContent = data.stats.certificates;
                }
            } catch (error) {
                console.error('Error cargando estadísticas:', error);
            }
        }
        
        async function loadSecrets(category) {
            if (!await checkAuthentication()) return;
            
            try {
                const response = await fetch(`/api/vault/list/${category}`, {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                
                if (data.success) {
                    currentSecrets[category] = data.secrets;
                    renderSecrets(category);
                }
            } catch (error) {
                console.error('Error cargando secretos:', error);
            }
        }
        
        function renderSecrets(category) {
            const secrets = currentSecrets[category] || [];
            const container = document.getElementById('secretsList');
            
            if (secrets.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center; padding: 50px;">No hay secretos en esta categoría</p>';
                return;
            }
            
            container.innerHTML = secrets.map(secret => `
                <div class="secret-item">
                    <div class="secret-header">
                        <div class="secret-name">${secret.name}</div>
                        <div class="secret-actions">
                            <button class="btn btn-small" onclick="viewSecret('${category}', '${secret.id}')">
                                👁️ Ver
                            </button>
                            <button class="btn btn-small btn-danger" onclick="deleteSecret('${category}', '${secret.id}', '${secret.name}')">
                                🗑️
                            </button>
                        </div>
                    </div>
                    <div style="color: #888; font-size: 0.9rem;">
                        Creado: ${new Date(secret.created).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }
        
        function selectCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const titles = {
                passwords: '🔑 Contraseñas',
                apiKeys: '🔐 API Keys',
                certificates: '📜 Certificados',
                documents: '📄 Documentos'
            };
            
            document.getElementById('categoryTitle').textContent = titles[category];
            loadSecrets(category);
        }
        
        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
            document.getElementById('newCategory').value = currentCategory;
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('newName').value = '';
            document.getElementById('newValue').value = '';
            document.getElementById('addResult').innerHTML = '';
        }
        
        async function addNewSecret() {
            const category = document.getElementById('newCategory').value;
            const name = document.getElementById('newName').value;
            const value = document.getElementById('newValue').value;
            
            if (!name || !value) {
                document.getElementById('addResult').innerHTML = '<div class="error">Por favor completa todos los campos</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/vault/add', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ category, name, value })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('addResult').innerHTML = '<div class="success">✅ Secreto agregado y cifrado exitosamente</div>';
                    setTimeout(() => {
                        closeAddModal();
                        loadStats();
                        loadSecrets(category);
                    }, 1500);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('addResult').innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
        
        async function viewSecret(category, id) {
            if (!await checkAuthentication()) return;
            
            try {
                const response = await fetch(`/api/vault/get/${category}/${id}`, {
                    headers: getAuthHeaders()
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('secretDetails').innerHTML = `
                        <div class="form-group">
                            <label>Nombre:</label>
                            <input type="text" value="${data.secret.name}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Valor Descifrado:</label>
                            <textarea readonly style="font-family: monospace;">${data.secret.value}</textarea>
                        </div>
                        <div class="form-group">
                            <label>Creado:</label>
                            <input type="text" value="${new Date(data.secret.metadata.created).toLocaleString()}" readonly>
                        </div>
                        <div class="form-group">
                            <label>Último Acceso:</label>
                            <input type="text" value="${new Date(data.secret.metadata.lastAccessed).toLocaleString()}" readonly>
                        </div>
                        <button class="btn" onclick="copyToClipboard('${data.secret.value.replace(/'/g, "\\'")}')">
                            📋 Copiar al Portapapeles
                        </button>
                    `;
                    document.getElementById('viewModal').classList.add('active');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function closeViewModal() {
            document.getElementById('viewModal').classList.remove('active');
        }
        
        async function deleteSecret(category, id, name) {
            if (!confirm(`¿Eliminar el secreto "${name}"? Esta acción no se puede deshacer.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/vault/delete/${category}/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadStats();
                    loadSecrets(category);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copiado al portapapeles');
            });
        }
        
        (async function init() {
            if (await checkAuthentication()) {
                loadStats();
                loadSecrets('passwords');
            }
        })();
    </script>
</body>
</html>
